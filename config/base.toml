# Gas price token pair
[gas]
enabled = true
token_symbol = "WETH"
token_address = "{{BASE_WETH}}"
token_decimals = 18
stable_symbol = "USDC"
stable_address = "{{BASE_USDC}}"
stable_decimals = 6
pool_address = "0xd0b53D9277642d899DF5C87A3966A349A798F224"
token_is_token0 = true

[aave_v3]
pool = "0xA238Dd80C259a72e81d7e4664a9801593F98d1c5"
pool_addresses_provider = "0xe20fCBdBfFC4Dd138cE8b2E6FBb6CB49777ad64D"
oracle = "0x2Cc0Fc26eD4563A5ce5e8bdcfe1A2878676Ae156"
data_provider = "0x0F43731EB8d45A581f4a36DD74F5f358bc90C73A"
ui_pool_data_provider = "0xb84A20e848baE3e13897934bB4e74E2225f4546B"
monitoring_enabled = true
borrowers_file = "cache/base/borrowers.txt"
allowed_assets = [
  "{{BASE_USDC}}",
  "{{BASE_WETH}}",
  "{{BASE_CBBTC}}",
]

# Base does not expose a full pending-tx stream — disable Path B to suppress warnings.
chainlink_pending_txs = false

[aave_v3.offchain_price]
enabled = true
dispatch_price_updates = true
require_onchain_confirmation = true
max_staleness_secs = 1200
max_confidence_bps = 150
min_rescan_interval_ms = 5000

# Arbitrage executor settings
[execution]
enabled = true
min_profit_threshold = 0.5
max_position_size = 100000000.0
use_flashloan = true
default_flashloan_provider = "Balancer"
max_priority_fee_gwei = 0.01
max_base_fee_gwei = 5
simulation_required = true
estimated_gas = 550000
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"

# Liquidation executor settings
[liquidation]
enabled = true
max_position_size = 100000000.0
estimated_gas = 550000
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"
min_liquidation_profit_usd = 5.0
# Morpho Blue on Base — checked first (0% fee, broad token coverage).
# If Morpho holds enough of the debt token, it is preferred over Balancer.
morpho = "0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb"
# AAVE V3 lending pool — last-resort flash-loan source (0.05% fee).
# Only used when both Morpho and Balancer are short on the debt token.
aave_pool = "0xA238Dd80C259a72e81d7e4664a9801593F98d1c5"
# Opportunity log — every detected liquidation (profitable or not) is appended.
opportunity_log = "cache/base/liquidation_opportunities.csv"
balancer_pool_ids = [
  "0xb7b8b3afc010169779c5c2385ec0eb0477fe3347",
  "0x7ab124ec4029316c2a42f713828ddf2a192b36db",
]

[aave_v3.offchain_price.pyth_hermes]
endpoint = "https://hermes.pyth.network"
poll_interval_ms = 700

[aave_v3.offchain_price.chainlink_streams]
