# Gas price token pair
[gas]
enabled = true
token_symbol = "WETH"
token_address = "{{BASE_WETH}}"
token_decimals = 18
stable_symbol = "USDC"
stable_address = "{{BASE_USDC}}"
stable_decimals = 6
pool_address = "0xd0b53D9277642d899DF5C87A3966A349A798F224"
token_is_token0 = true

# AAVE V3 — used as Tier-3 flash loan fallback (0.05% fee) when Balancer/Morpho
# cannot fund the debt token.  Also powers the optional Chainlink oracle for
# start-token USD price logging.  Set default_flashloan_provider = "AaveV3" in
# [execution] to promote this to the primary flash loan source.
[aave_v3]
pool   = "0xA238Dd80C259a72e81d7e4664a9801593F98d1c5"
oracle = "0x2Cc0Fc26eD4563A5ce5e8bdcfe1A2878676Ae156"


# Arbitrage executor settings
[execution]
use_flashloan = true
default_flashloan_provider = "Balancer"
max_gas_limit = 1000000          # max gas per arb tx
profit_share_bps = 5000          # 50% of profit → priority fee
min_submit_profit_wei = 50000000000000   # 0.00005 ETH min profit for submission
min_sim_profit_wei = 100000000000000    # 0.0001 ETH min profit to pass simulator
optimization_steps = 20          # binary search iterations
min_input_eth = 0.01             # min flash-loan input (ETH)
max_input_eth = 50.0             # max flash-loan input (ETH)
max_hops = 4                     # max arb path length
max_paths_per_token = 200000     # paths generated per start token at startup
max_paths_per_block = 50000      # max paths evaluated per block
searcher_gas_estimate = 250000   # rough gas estimate for searcher pre-screening
flash_loan_fee_aave_bps = 5      # Aave V3 flash-loan fee (5 = 0.05%)

# EIP-1559 base-fee prediction parameters — Base / Optimism Canyon hardfork values.
# These must match the on-chain protocol constants for accurate next-block prediction.
[gas_params]
eip1559_elasticity_multiplier = 6        # Base/Optimism: gas_target = gas_limit / 6
eip1559_base_fee_change_denominator = 50 # Base/Optimism: slow adjustment (2% per block max)
min_base_fee_wei = 1000000               # 0.001 gwei — Base L2 enforced floor
priority_fee_cap_gwei = 10               # hard cap on priority bid (Base is cheap)