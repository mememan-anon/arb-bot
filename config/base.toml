[chain]
name = "base"
chain_id = 8453
# RPC URLs — set WSS_URL and HTTPS_URL in .env to override (keep API keys out of this file)
https_url = ""
wss_url   = ""
wss_urls  = []

cache_dir = "base"
# Output cap: real arb is ~1.001-1.02x; anything above ~5x is honeypot/simulation error.
# Formula: max allowed return = max_profit_pct / 10  (so 50 → 5x cap)
max_profit_pct = 50.0
blacklisted_tokens = [
  "0x5ab3d4c385b400f3abb49e80de2faf6a88a7b691",  # FLOCK — fee-on-transfer (tax token)
  "0x74ccbe53f77b08632ce0cb91d3a545bf6b8e0979",  # fBOMB — FoT; K() invariant fails in vAMM pairs
]

# ── Start tokens ────────────────────────────────────────────────────────────

[[start_tokens]]
symbol = "WETH"
address = "0x4200000000000000000000000000000000000006"
decimals = 18
price_pool = "0x6c561B446416E1A00E8E93E221854d6eA4171372"  # Uniswap V3 WETH/USDC on Base

[[start_tokens]]
symbol = "USDC"
address = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
decimals = 6

[[start_tokens]]
symbol = "cbBTC"
address = "0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf"
decimals = 8
price_pool = "0xfBB6Eed8e7aa03B138556eeDaF5D271A5E1e43ef"  # Uniswap V3 USDC/cbBTC on Base

# ── DEXes ────────────────────────────────────────────────────────────────────

# Uniswap V2 on Base + Aerodrome (volatile + stable pools)
# Pool data pulled via:
#   python scripts/pull_base_uniswap.py --v2           (Uniswap V2 pairs)
#   python scripts/pull_aerodrome.py --amm             (Aerodrome V1 volatile + stable)
# Cached to: cache/base/.cached-pools.csv
# CSV version codes: 2=UniV2, 4=SolidlyStable, 5=SolidlyVolatile
# Aerodrome volatile pools use version=5, fee=30 (0.30%)
# Aerodrome stable pools use version=4, fee=5 (0.05%)
[dexes.v2]
enabled = true
factories = [
  "0x8909Dc15e40173Ff4699343b6eb8132c65e18eC6",  # Uniswap V2 Factory (Base)
  "0x02a84c1b3BBD7401a5f7fa98a384EBC70bB5749E",  # PancakeSwap V2 Factory (Base)
]
routers = [
  "0x4752ba5dbc23f44d87826276bf6fd6b1c372ad24",  # Uniswap V2 Router02 (Base)
  "0x8cFe327CEc66d1C090Dd72bd0FF11d690C33a2Eb",  # PancakeSwap V2 Router (Base)
]
from_blocks = [0, 0]
direct_pair = true

[dexes.v3]
enabled = false
factories = []
routers = []
quoter = ""
fee_tiers = [100, 500, 3000, 10000]

[dexes.algebra]
enabled = false
factories = []
routers = []
quoter = ""

# Uniswap V3 concentrated liquidity on Base (slot0 ABI)
# + Aerodrome Slipstream CL pools (same slot0/uniswapV3SwapCallback ABI)
# Pool data pulled via:
#   python scripts/pull_base_uniswap.py --v3           (Uniswap V3)
#   python scripts/pull_aerodrome.py --cl              (Aerodrome Slipstream)
# Cached to: cache/base/.cached-v3cl-pools.csv
[dexes.uniswapv3cl]
enabled = true
# Primary factory (Uniswap V3 — backward compat single-factory field)
factory = "0x33128a8fC17869897dcE68Ed026d694621f6FDfD"   # Uniswap V3 Factory (Base)
# Additional V3-compatible factories (same slot0/swap ABI — pool data lands in same CSV)
factories = [
  "0x0BFbCF9fa4f9C56B0F40a672E3D1B50B6eD5B5F8",  # PancakeSwap V3 Factory (Base)
]
# Routers indexed parallel to factories[] above
router  = "0x2626664c2603336E57B271c5C0b26F421741e481"   # Uniswap V3 SwapRouter02 (Base)
routers = [
  "0x1b81D678ffb9C0263b24A97847620C99d213eB14",  # PancakeSwap V3 SmartRouter (Base)
]
quoter  = "0x3d4e44Eb1374240CE5F1B136041212501e4a0139"   # Uniswap V3 QuoterV2 (Base)

# Raw Uniswap V3 liquidity floor (NOT USD). Filters dust with near-zero active.
#leave it like this since it just idicates some liquidity. Main filtering at csv generation 50k tvl
min_liquidity = 1

# Uniswap V4 — also stored in the V3CL CSV for data purposes.
# NOTE: V4 uses a singleton PoolManager; on-chain execution requires a new
#       bot contract path (_swapV4PoolManager). Currently pulled/stored as data
#       only; set enabled = false until the contract is updated.
# Pool data pulled via: python scripts/pull_base_uniswap.py --v4
# Cached to: cache/base/.cached-v4cl-pools.csv
[dexes.uniswapv4cl]
enabled = false
pool_manager = "0x498581fF718922c3f8e6A244956aF099B2652b2b"  # Uniswap V4 PoolManager (Base)

# PancakeSwap Infinity (V4) — singleton PoolManager architecture with Flash Accounting.
# Two pool types: CL (concentrated liquidity) and Bin (Liquidity Book).
# Requires new bot contract path (_swapInfinityPoolManager) — NOT yet implemented.
# Contract addresses from: github.com/pancakeswap/infinity-core/script/config/base-mainnet.json
[dexes.pancakeswap_infinity]
enabled = false
vault         = "0x238a358808379702088667322f80aC48bAd5e6c4"  # PCS Infinity Vault (Base)
cl_pool_manager  = "0xa0FfB9c1CE1Fe56963B0321B32E7A0302114058b"  # PCS Infinity CLPoolManager (Base)
bin_pool_manager = "0xC697d2898e0D09264376196696c51D7aBbbAA4a9"  # PCS Infinity BinPoolManager (Base)

[dexes.lfj]
enabled = false
router_v22 = ""
router_v21 = ""

# ── Gas pricing pool ─────────────────────────────────────────────────────────
# Uses a live on-chain pool to convert ETH gas costs → USD equivalent profit
# threshold. WETH/USDC 0.05% Uniswap V3 pool on Base.
[gas]
enabled = true
token_symbol  = "WETH"
token_address = "0x4200000000000000000000000000000000000006"
token_decimals = 18

stable_symbol  = "USDC"
stable_address = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
stable_decimals = 6
pool_address   = "0xd0b53D9277642d899DF5C87A3966A349A798F224"  # UniV3 WETH/USDC 0.05%
token_is_token0 = true   # WETH (0x4200...) < USDC (0x8335...) → token0

# ── AaveV3 (Base) ────────────────────────────────────────────────────────────
# Verify latest addresses at: https://docs.aave.com/developers/deployed-contracts/v3-mainnet/base
[aave_v3]
pool                    = "0xA238Dd80C259a72e81d7e4664a9801593F98d1c5"
pool_addresses_provider = "0xe20fCBdBfFC4Dd138cE8b2E6FBb6CB49777ad64B"
oracle                  = "0x2Cc0Fc26eD4563A5ce5e8bdcfe1A2878676Ae156"
data_provider           = "0x0F43731EB8d45A581f4a36DD74F5f358bc90C73A"
allowed_assets = [
  "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",  # USDC
  "0x4200000000000000000000000000000000000006",  # WETH
  "0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf",  # cbBTC
  ]

# ── Execution ─────────────────────────────────────────────────────────────────
[execution]
enabled = true
min_profit_threshold = 0.5      # Minimum net profit in USD (0.0 = log everything; raise after testing)
max_position_size = 100000000.0
use_flashloan = true
default_flashloan_provider = "Balancer"
max_priority_fee_gwei = 0.01     # Base L2: priority fees are tiny
max_base_fee_gwei = 5            # Base L2: very cheap
simulation_required = true
estimated_gas = 550000
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"  # Balancer V2 Vault (same all chains)