address_file = "addresses/avax.toml"

[chain]
name = "avalanche"
chain_id = 43114
# RPC URLs — set WSS_URL and HTTPS_URL in .env to override (keep API keys out of this file)
https_url = ""
wss_url   = ""
wss_urls  = []
cache_dir = "avax"
# Output cap: 10=1x, 20=2x, 50=5x. Real arb is ~1.001-1.02x; dust fakes are ~235,000x.
max_profit_pct = 80.0
# Tokens to skip during path generation (scam / honeypot contracts)
blacklisted_tokens = [
  "0x9469603F3Efbcf17e4A5868d81C701BDbD222555",  # known scam token on AVAX
]

[[start_tokens]]
symbol = "WAVAX"
address = "{{AVAX_WAVAX}}"
decimals = 18

[[start_tokens]]
symbol = "USDC"
address = "{{AVAX_USDC}}"
decimals = 6

[[start_tokens]]
symbol = "USDT"
address = "{{AVAX_USDT}}"
decimals = 6

[[start_tokens]]
symbol = "BTC.b"
address = "{{AVAX_BTCB}}"
decimals = 8

[dexes.v2]
enabled = true
factories = ["0xfe926062fb99ca5653080d6c14fe945ad68c265c"]  # Blackhole V2 factory
routers = ["0x04E1dee021Cd12bBa022A72806441B43d8212Fec"]
from_blocks = [64928028]
direct_pair = true  # Use pair contract directly (no router CREATE2 lookup)

[dexes.v3]
enabled = false
factories = []
routers = []
quoter = ""
fee_tiers = [100, 500, 3000, 10000]

[dexes.algebra]
enabled = true
factories = ["0x512eb749541B7cf294be882D636218c84a5e9E5F"]
routers = ["0xaBfc48e8BED7b26762745f3139555F320119709d"]
quoter = "0x3e182bcf14Be6142b9217847ec1112e3c39Eb689"

# UniswapV3 CL pools (any V3 fork: Pharaoh, etc.) — slot0() ABI.
# Pool data cached via: python scripts/pull_pharaoh.py --cl --config-path config/avax.toml
# Cached to: cache/avax/.cached-v3cl-pools.csv
[dexes.uniswapv3cl]
enabled = true
factory = "0xAE6E5c62328ade73ceefD42228528b70c8157D0d"   # UniswapV3CLFactory (Pharaoh)
router  = "0xc8B8fCbDb5C019D7802fFb0b39603395D7d3915c"   # SwapRouter
quoter  = "0xAdAe75447D112cfC401C952744de3E6d32456465"   # Quoter

# LFJ (Liquidity Book) V2.1/V2.2 bin-based AMM.
# Pool data cached via: python scripts/pull_lfj.py --min-tvl 10000
# Cached to: cache/avax/.cached-lfj-pools.csv
[dexes.lfj]
enabled = true
router_v22 = "0x18556DA13313f3532c54711497A8FedAC273220E"  # LBRouter V2.2
router_v21 = "0xb4315e873dBcf96Ffd0acd8EA43f689D8c20fB30"  # LBRouter V2.1

[gas]
enabled = true
token_symbol = "WAVAX"
token_address = "{{AVAX_WAVAX}}"
token_decimals = 18

stable_symbol = "USDC"
stable_address = "{{AVAX_USDC}}"
stable_decimals = 6
pool_address = "0xa02ec3ba8d17887567672b2cdcaf525534636ea0"
token_is_token0 = false

[aave_v3]
pool = "{{AVAX_AAVE_POOL}}"
pool_addresses_provider = "{{AVAX_AAVE_PROVIDER}}"
oracle = "{{AVAX_AAVE_ORACLE}}"
data_provider = "{{AVAX_AAVE_DATA_PROVIDER}}"
allowed_assets = [
  "{{AVAX_USDC}}", # USDC
  "{{AVAX_USDT}}", # USDT
  "{{AVAX_WAVAX}}",  # WAVAX
  "{{AVAX_BTCB}}" # BTC
]

[execution]
enabled = true       # Set to true only when you have a deployed V2ArbBot contract
min_profit_threshold = 0.50  # Minimum net profit in USD (token-agnostic; $0.50 ≈ 0.016 WAVAX at $30/AVAX)
max_position_size = 100000000.0  # Maximum amount to trade in USD
use_flashloan = true
default_flashloan_provider = "AaveV3"  # Options: AaveV3, Balancer, UniswapV2
max_priority_fee_gwei =2  # Maximum priority fee in GWEI
max_base_fee_gwei = 100  # Maximum base fee in GWEI
simulation_required = true  # Require successful simulation before execution
estimated_gas = 550000  # Estimated gas units per arb transaction
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"  # Balancer V2 Vault (AVAX)

[liquidation]
enabled = true
max_position_size = 100000000.0
estimated_gas = 550000
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"
min_liquidation_profit_usd = 5.0
balancer_pool_ids = []
