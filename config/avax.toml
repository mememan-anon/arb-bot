address_file = "addresses/avax.toml"

[chain]
name = "avalanche"
chain_id = 43114
# RPC URLs — set WSS_URL and HTTPS_URL in .env to override (keep API keys out of this file)
https_url = ""
wss_url   = ""
wss_urls  = []
cache_dir = "avax"
# Output cap: 10=1x, 20=2x, 50=5x. Real arb is ~1.001-1.02x; dust fakes are ~235,000x.
max_profit_pct = 80.0
# Tokens to skip during path generation (scam / honeypot contracts)
blacklisted_tokens = [
  "0x9469603F3Efbcf17e4A5868d81C701BDbD222555",  # known scam token on AVAX
]

[[start_tokens]]
symbol = "WAVAX"
address = "{{AVAX_WAVAX}}"
decimals = 18

[[start_tokens]]
symbol = "USDC"
address = "{{AVAX_USDC}}"
decimals = 6

[[start_tokens]]
symbol = "USDT"
address = "{{AVAX_USDT}}"
decimals = 6

[[start_tokens]]
symbol = "BTC.b"
address = "{{AVAX_BTCB}}"
decimals = 8

[dexes.v2]
enabled = true
factories = ["0xfe926062fb99ca5653080d6c14fe945ad68c265c"]  # Blackhole V2 factory
routers = ["0x04E1dee021Cd12bBa022A72806441B43d8212Fec"]
from_blocks = [64928028]
direct_pair = true  # Use pair contract directly (no router CREATE2 lookup)

[dexes.algebra]
enabled = true
factories = ["0x512eb749541B7cf294be882D636218c84a5e9E5F"]
routers = ["0xaBfc48e8BED7b26762745f3139555F320119709d"]
quoter = "0x3e182bcf14Be6142b9217847ec1112e3c39Eb689"

# UniswapV3 CL pools (any V3 fork: Pharaoh, etc.) — slot0() ABI.
# Pool data cached via: python scripts/pull_pharaoh.py --cl --config-path config/avax.toml
# Cached to: cache/avax/.cached-v3cl-pools.csv
[dexes.uniswapv3cl]
enabled = true
factory = "0xAE6E5c62328ade73ceefD42228528b70c8157D0d"   # UniswapV3CLFactory (Pharaoh)
router  = "0xc8B8fCbDb5C019D7802fFb0b39603395D7d3915c"   # SwapRouter
quoter  = "0xAdAe75447D112cfC401C952744de3E6d32456465"   # Quoter

# LFJ (Liquidity Book) V2.1/V2.2 bin-based AMM.
# Pool data cached via: python scripts/pull_lfj.py --min-tvl 10000
# Cached to: cache/avax/.cached-lfj-pools.csv
[dexes.lfj]
enabled = true
router_v22 = "0x18556DA13313f3532c54711497A8FedAC273220E"  # LBRouter V2.2
router_v21 = "0xb4315e873dBcf96Ffd0acd8EA43f689D8c20fB30"  # LBRouter V2.1

[revm_filter.routers]
uniswapv2 = "0x04E1dee021Cd12bBa022A72806441B43d8212Fec"
uniswapv3 = "0xc8B8fCbDb5C019D7802fFb0b39603395D7d3915c"

[gas]
enabled = true
token_symbol = "WAVAX"
token_address = "{{AVAX_WAVAX}}"
token_decimals = 18

stable_symbol = "USDC"
stable_address = "{{AVAX_USDC}}"
stable_decimals = 6
pool_address = "0xa02ec3ba8d17887567672b2cdcaf525534636ea0"
token_is_token0 = false

[aave_v3]
pool = "{{AVAX_AAVE_POOL}}"
pool_addresses_provider = "{{AVAX_AAVE_PROVIDER}}"
oracle = "{{AVAX_AAVE_ORACLE}}"
data_provider = "{{AVAX_AAVE_DATA_PROVIDER}}"
allowed_assets = [
  "{{AVAX_USDC}}", # USDC
  "{{AVAX_USDT}}", # USDT
  "{{AVAX_WAVAX}}",  # WAVAX
  "{{AVAX_BTCB}}" # BTC
]

[execution]
use_flashloan = true
default_flashloan_provider = "AaveV3"  # Options: AaveV3, Balancer
max_gas_limit = 1000000          # max gas per arb tx
profit_share_bps = 5000          # 50% of profit → priority fee
min_submit_profit_wei = 50000000000000   # 0.00005 AVAX min profit for submission
min_sim_profit_wei = 100000000000000    # 0.0001 AVAX min profit to pass simulator
optimization_steps = 20          # binary search iterations
min_input_eth = 0.01             # min flash-loan input (AVAX units)
max_input_eth = 50.0             # max flash-loan input (AVAX units)
max_hops = 4                     # max arb path length
max_paths_per_token = 200000     # paths generated per start token at startup
max_paths_per_block = 50000      # max paths evaluated per block
searcher_gas_estimate = 250000   # rough gas estimate for searcher pre-screening
flash_loan_fee_aave_bps = 5      # Aave V3 flash-loan fee (5 = 0.05%)

# EIP-1559 base-fee prediction parameters — Avalanche C-Chain (AP4 / Cortina) values.
# These must match the on-chain protocol constants for accurate next-block prediction.
[gas_params]
eip1559_elasticity_multiplier = 2       # AVAX: standard EIP-1559 (gas_target = gas_limit / 2)
eip1559_base_fee_change_denominator = 8 # AVAX: standard adjustment rate
min_base_fee_wei = 25000000000          # 25 gwei — Avalanche C-Chain enforced floor
priority_fee_cap_gwei = 10              # AVAX fees can spike; 10 gwei cap

[liquidation]
enabled = true
max_position_size = 100000000.0
estimated_gas = 550000
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"
min_liquidation_profit_usd = 5.0
balancer_pool_ids = []
