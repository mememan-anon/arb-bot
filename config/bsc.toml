[execution]
use_flashloan = true
default_flashloan_provider = "UniswapV3"
dynamic_flashloan_routing = false
flashloan_providers = ["UniswapV3", "PancakeSwapV3", "AaveV3"]
profit_share_bps = 5000          # 50% of profit → priority fee
flash_loan_fee_aave_bps = 5      # Aave V3 flash-loan fee (5 = 0.05%)
flash_loan_fee_uniswap_v3_bps = 0
flash_loan_fee_pancakeswap_v3_bps = 0
max_hops = 5                    # max arb path length

max_gas_limit = 450000           # The maximum gas units your arb transaction is allowed to use.
min_submit_profit_wei = 500000000000000   # ~$0.30 at $600/BNB — net profit threshold to submit
min_sim_profit_wei = 1000000000000000   # ~$0.60 at $600/BNB — pre-screen threshold before full REVM simulation
optimization_steps = 12          # binary search iterations
min_input_eth = 0.01             # min flash-loan input (BNB units). Below 0.01 BNB the profit is too small to cover gas.
max_input_eth = 50.0             # max flash-loan input (BNB units). Above 50 BNB you'd drain pool liquidity and the arb collapses anyway.
max_paths_per_token = 200000     # paths generated per start token at startup
max_paths_per_block = 300000      # searcher eval is <10ms for 80 paths (parallel rayon), ~120ms for 1000. Paths are shuffled so each block samples different paths.
searcher_gas_estimate = 450000   # rough gas estimate for searcher pre-screening
num_simulators = 8               # parallel REVM simulator workers (fan-out from shared channel)
channel_buffer = 4096            # inter-worker mpsc buffer (larger for 150K paths/block)
enable_mempool = true            # subscribe to pending DEX swaps from BSC mempool
max_stale_blocks = 5             # stale-block cutoff for both simulators and tx-sender
strike_threshold = 3             # path/token blacklist strikes before blacklisting

#SKIP_POOL_FILTER=1

# BSC EIP-1559 parameters — confirmed from bnb-chain/bsc params/config.go source.
# baseFeePerGas is always 0x0 on BSC (chain utilization ~19%, well below 50% target),
# so base fee stays at the min_base_fee_wei floor. Values 2 and 8 are the correct
# BSC protocol constants (DefaultElasticityMultiplier / DefaultBaseFeeChangeDenominator).
# The Rust default is Base/OP values (6/50) — must override here or gas_station.rs is wrong.
[gas_params]
eip1559_elasticity_multiplier = 2       # BSC: gas_target = gas_limit / 2 (55M / 2 = 27.5M target)
eip1559_base_fee_change_denominator = 8 # BSC: standard go-ethereum default (same as mainnet)
min_base_fee_wei = 50000000             # 0.05 gwei — verified live via eth_gasPrice (0x2faf080)
priority_fee_cap_gwei = 3               # max tip bid cap (~3.05 gwei total max)
