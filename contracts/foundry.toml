[profile.default]
solc_version = '0.8.13'
auto_detect_solc = false
optimizer = true
optimizer_runs = 200 # Default amount
via_ir = true        # Enable IR optimizer — avoids stack-too-deep in complex functions
evm_version = "cancun"  # Required: AAVE V3.1 on Base uses TLOAD/TSTORE (EIP-1153)
remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
]

# BSC fork profile — used by BscArbForkTest.t.sol
# Run with: forge test --profile bsc_fork --match-contract BscArbForkTest -vv
# Or set FORK_URL env var to your BSC RPC and use --profile default.
[profile.bsc_fork]
solc_version = '0.8.13'
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
]
[profile.bsc_fork.fuzz]
runs = 64  # Fewer fuzz runs for fork tests (RPC-heavy)